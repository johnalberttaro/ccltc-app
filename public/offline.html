<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15803d">
    <title>Offline | Tennis Records</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
               background: #f9fafb; color: #111827; text-align: center; }
        @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e8edf3; } p { color: #9aa7b8 !important; } }
        img { width: 88px; height: 88px; border-radius: 20px; }
        h1 { font-size: 22px; margin: 18px 0 6px; letter-spacing: -0.015em; }
        p { margin: 0 0 20px; color: #6b7280; font-size: 15px; }
        button { background: #15803d; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png?v=2" alt="">
        <h1>You're offline</h1>
        <p>Tennis Records needs an internet connection.<br>Check your Wi-Fi or mobile data and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
